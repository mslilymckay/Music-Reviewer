<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Liner Notes</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- AUTH SCREEN (Hidden by default, shown via JS if no session) -->
  <div id="auth-screen" class="hidden">
    <div class="auth-card lnotes-card">
      <h2 id="auth-header" class="lnotes-section-heading">Welcome to Liner Notes</h2>

      <div class="auth-toggle-group">
        <button id="toggle-login" class="auth-toggle-btn active">Log In</button>
        <button id="toggle-register" class="auth-toggle-btn">Sign Up</button>
      </div>
      
      <input type="email" id="auth-email" class="input-group" placeholder="Email Address">
      <input type="password" id="auth-password" class="input-group" placeholder="Password">
      
      <button id="auth-submit-btn" class="primary-btn" style="width: 100%; margin-top: 10px;">Let's go!</button>
      
      <p id="auth-error" style="color: var(--ink-dark); font-size: 0.85rem; margin-top: 15px; display: none;"></p>
    </div>
  </div>

  <div id="lnotes-modal-overlay" class="lnotes-modal-overlay hidden">
    <div id="lnotes-modal-card" class="lnotes-modal-card">
      <h2 id="lnotes-modal-title" class="lnotes-section-heading">Notification</h2>
      <p id="lnotes-modal-message"></p>
      <input type="text" id="lnotes-modal-input" class="input-group" style="display: none; margin-bottom: 15px; border: 1px solid var(--detail-line); box-sizing: border-box;" placeholder="Enter value...">
      <div style="display: flex; gap: 10px;">
        <button id="lnotes-modal-cancel" class="secondary-btn">Cancel</button>
        <button id="lnotes-modal-confirm" class="primary-btn">Confirm</button>
      </div>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <main id="app-container">

    <!-- VIEW: NEW ENTRY FORM -->
    <section id="view-form" class="page-view active">
      <header class="app-header">
        <h1>New Entry</h1>
      </header>
      
      <form id="new-review-form" class="liner-form">
        <div class="input-group">
          <label for="input-spotify-url">Spotify Share Link</label>
          <input type="url" id="input-spotify-url" placeholder="Paste link here..." required>
        </div>

        <div class="input-group split">
          <div>
            <label for="input-artist">Artist</label>
            <input type="text" id="input-artist" required>
          </div>
          <div>
            <label for="input-track">Track</label>
            <input type="text" id="input-track" required>
          </div>
        </div>

        <div class="input-group">
          <label for="input-album">Album</label>
          <input type="text" id="input-album">
        </div>

        <div class="input-group">
          <label for="input-credits">Credits</label>
          <textarea id="input-credits" rows="2"></textarea>
        </div>

        <div class="input-group">
          <label for="input-lyric">Lyric Focus</label>
          <textarea id="input-lyric" rows="3" placeholder="Highlight something special..."></textarea>
        </div>

        <div class="input-group">
          <label for="input-trivia">Curiosities</label>
          <textarea id="input-trivia" rows="2"></textarea>
        </div>

        <div class="input-group">
          <label for="input-tier">Shelf</label>
          <select id="input-tier">
            <option value="Essential">Essential</option>
            <option value="Deep Cuts">Deep Cuts</option>
            <option value="Still Considering">Still Considering</option>
          </select>
        </div>

        <button type="submit" id="submit-review-btn" class="primary-btn">Update Collection</button>
      </form>
    </section>

    <!-- VIEW: LINER NOTES DASHBOARD (Hidden initially) -->
    <section id="view-liner-notes" class="page-view">
      
      <!-- The 1:1 Jewel Case Card -->
      <div class="jewel-case-wrapper">
        <div class="jewel-case">
          <!-- Tab Navigation inside the booklet -->
          <nav class="booklet-tabs">
            <button class="tab-btn active" data-tab="tab-metadata">Credits</button>
            <button class="tab-btn" data-tab="tab-review">Review</button>
          </nav>

          <!-- Tab Content: Metadata -->
          <div id="tab-metadata" class="tab-content active">
            <h2 id="display-track" class="track-title">Track Name</h2>
            <h3 id="display-artist" class="artist-name">Artist Name</h3>
            
            <div class="metadata-section">
              <h4>Credits</h4>
              <p id="display-credits" class="typewriter-text">...</p>
            </div>
            
            <div class="metadata-section">
              <h4>Curiosities</h4>
              <p id="display-trivia" class="typewriter-text">...</p>
            </div>
          </div>

          <!-- Tab Content: Review and Lyrics -->
          <div id="tab-review" class="tab-content">
            <blockquote id="display-lyric" class="lyric-focus">
              "Placeholder lyric..."
            </blockquote>
            <p id="display-tier" class="tier-badge">Essential</p>
          </div>
        </div>
      </div>

      <!-- Compact Spotify Embed (Fixed to bottom) -->
      <div class="player-container">
        <iframe id="spotify-player" src="" width="100%" height="80" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      </div>

    </section>

  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
